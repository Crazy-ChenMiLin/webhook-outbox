name: Bug report
description: The package or the relay does not behave as documented
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - PHP package
        - Relay
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version, relay image tag, or a commit.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Code or SQL, RELAY_* settings (without passwords), PostgreSQL version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Relay log lines and rows from webhook_attempts help.
    validations:
      required: true
