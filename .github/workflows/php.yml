name: php

on:
  push:
    branches: [master]
    paths: ["src/**", "tests/**", "schema/**", "composer.json", "phpunit.xml.dist", "phpstan.neon", ".github/workflows/php.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "schema/**", "composer.json", "phpunit.xml.dist", "phpstan.neon", ".github/workflows/php.yml"]
  workflow_dispatch:

jobs:
  test:
    name: php ${{ matrix.php }}, postgres ${{ matrix.postgres }}${{ matrix.dependencies == 'lowest' && ', lowest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        postgres: ["14", "18"]
        dependencies: ["highest"]
        include:
          - php: "8.3"
            postgres: "14"
            dependencies: lowest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: webhooks
          POSTGRES_PASSWORD: webhooks
          POSTGRES_DB: webhooks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webhooks"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite
          coverage: none
      - run: composer update --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      # A green run that skipped the database tests proves nothing, so fail on skips.
      - run: vendor/bin/phpunit --fail-on-skipped
        env:
          WEBHOOK_OUTBOX_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=webhooks;user=webhooks;password=webhooks
      - run: vendor/bin/phpstan analyse --no-progress
        if: matrix.dependencies == 'highest'
